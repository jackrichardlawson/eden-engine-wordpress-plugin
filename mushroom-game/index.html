<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Mushroom Mischief</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17221b;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}#ui{position:fixed;inset:0;display:flex;flex-direction:column}.top{display:flex;gap:8px;align-items:center;padding:8px;background:#111a;backdrop-filter:blur(6px);z-index:3}.top b{font-size:18px}.pill{background:#243428;border:1px solid #ffffff26;border-radius:999px;padding:6px 10px;font-size:13px}.spacer{flex:1}button{border:0;border-radius:14px;background:#f3c851;color:#222;font-weight:800;padding:10px 14px;font-size:15px}canvas{width:100%;height:100%;display:block;background:#9fd18d}#controls{position:fixed;inset:auto 0 10px 0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;z-index:4;pointer-events:none}.pad,.acts{pointer-events:auto}.pad{width:138px;height:138px;position:relative}.pad button,.acts button{position:absolute;width:48px;height:48px;border-radius:50%;padding:0;background:#ffffffd9;box-shadow:0 3px 10px #0005}.pad .u{left:45px}.pad .d{left:45px;bottom:0}.pad .l{left:0;top:45px}.pad .r{right:0;top:45px}.acts{width:150px;height:138px;position:relative}.acts .tag{right:0;top:28px;width:66px;height:66px;background:#ffd45c}.acts .dash{left:0;bottom:5px;background:#9ee7ff}.overlay{position:fixed;inset:0;background:#101815e8;display:grid;place-items:center;z-index:10;padding:22px}.card{max-width:520px;width:100%;background:#223129;border:1px solid #ffffff24;border-radius:24px;padding:22px;text-align:center;box-shadow:0 20px 60px #0008}.card h1{margin:0 0 6px;font-size:34px}.card p{opacity:.85;line-height:1.4}.skins{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.skin{width:52px;height:52px;border-radius:50%;border:3px solid transparent;padding:0}.skin.sel{border-color:white}.small{font-size:12px;opacity:.72}.hidden{display:none}@media(min-width:900px){#controls{display:none}}</style></head><body><div id='ui'><div class='top'><b>🍄 Mushroom Mischief</b><span class='pill' id='area'>Backyard</span><span class='pill'>Round <span id='round'>1</span></span><span class='pill'>Tagged <span id='score'>0</span>/5</span><span class='spacer'></span><button id='mapBtn'>Map</button></div><canvas id='c'></canvas></div><div id='controls'><div class='pad'><button class='u'>▲</button><button class='d'>▼</button><button class='l'>◀</button><button class='r'>▶</button></div><div class='acts'><button class='dash'>DASH</button><button class='tag'>TAG</button></div></div><div class='overlay' id='start'><div class='card'><h1>🍄 Mushroom Mischief</h1><p>Run around the places from your drawing. Get close to another mushroom and tap <b>TAG</b>. Every 5 rounds unlocks a new mushroom skin.</p><div class='skins' id='skins'></div><button id='play'>PLAY</button><p class='small'>Phone: touch controls • Computer: arrows/WASD, E to tag, Space to dash</p></div></div><div class='overlay hidden' id='map'><div class='card'><h1>Choose a place</h1><div style='display:grid;gap:10px' id='places'></div><button id='closeMap' style='margin-top:14px'>Back</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,keys={},round=1,score=0,area=2,last=0,dash=0,sel=0;const names=['Farmers’ Market','Messy Playroom','Backyard','Park','Rock & Gem Garden'];const themes=[['#e7c77a','#9b6a3d'],['#dbc6f2','#c06b77'],['#8ed17b','#6ca85d'],['#8fd5a0','#5e9f6d'],['#b8a78b','#7f735f']];const skins=['#d7c3a2','#6ebc72','#ef8b45','#b792d8','#f2df62','#6fc7cf','#ff6f91','#9b7bff','#f4a261','#78c6ff'];let unlocked=+localStorage.mmUnlock||4;let p={x:0,y:0,r:18,v:2.7};let bots=[];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;p.x=Math.min(p.x||W/2,W-30);p.y=Math.min(p.y||H/2,H-60)}addEventListener('resize',resize);resize();
function mkBots(){bots=[];for(let i=0;i<5;i++)bots.push({x:70+Math.random()*(W-140),y:90+Math.random()*(H-180),r:17,dx:(Math.random()-.5)*1.5,dy:(Math.random()-.5)*1.5,on:1,col:skins[(i+1)%unlocked]})}mkBots();
function mush(o,col){x.save();x.translate(o.x,o.y);x.fillStyle='#efe0c7';x.beginPath();x.rect(-7,0,14,22);x.fill();x.fillStyle=col;x.beginPath();x.arc(0,0,18,Math.PI,0);x.lineTo(18,2);x.quadraticCurveTo(0,11,-18,2);x.closePath();x.fill();x.fillStyle='#fff9';for(let a=-10;a<=10;a+=10){x.beginPath();x.arc(a,-5,2.2,0,7);x.fill()}x.restore()}
function bg(){let [a,b]=themes[area];x.fillStyle=a;x.fillRect(0,0,W,H);x.globalAlpha=.3;x.fillStyle=b;for(let i=0;i<18;i++){let xx=(i*97+area*53)%W,yy=(i*61+area*79)%H;x.beginPath();x.arc(xx,yy,12+(i%4)*5,0,7);x.fill()}x.globalAlpha=1;x.fillStyle='#203024';x.font='800 28px system-ui';x.fillText(names[area],20,78);if(area===0){for(let i=0;i<6;i++){x.fillStyle='#fff2d2';x.fillRect(30+i*120,H*.28,90,42);x.fillStyle=['#d54','#e96','#7a5','#f2c14e'][i%4];x.fillRect(45+i*120,H*.29,60,16)}}if(area===1){for(let i=0;i<8;i++){x.fillStyle=['#ed6','#6cf','#f88','#9d8'][i%4];x.fillRect(40+(i*89)%W,150+(i*73)%(H-260),28,28)}}if(area===3){x.fillStyle='#5c9d54';x.beginPath();x.ellipse(W*.68,H*.45,140,70,0,0,7);x.fill();x.fillStyle='#8b6f47';x.fillRect(W*.2,H*.55,120,14)}if(area===4){for(let i=0;i<16;i++){x.fillStyle=['#777','#9a7','#ad8','#c9b'][i%4];x.beginPath();x.arc(30+(i*83)%W,130+(i*57)%(H-220),8+(i%3)*4,0,7);x.fill()}}}
function upd(dt){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let m=Math.hypot(dx,dy)||1,sp=p.v*(dash>0?2.2:1);p.x=Math.max(20,Math.min(W-20,p.x+dx/m*sp*dt));p.y=Math.max(95,Math.min(H-25,p.y+dy/m*sp*dt));dash=Math.max(0,dash-dt);for(let b of bots)if(b.on){b.x+=b.dx*dt;b.y+=b.dy*dt;if(b.x<20||b.x>W-20)b.dx*=-1;if(b.y<95||b.y>H-30)b.dy*=-1;let dd=Math.hypot(p.x-b.x,p.y-b.y);if(dd<110){b.dx+=(b.x-p.x)/Math.max(dd,1)*.025*dt;b.dy+=(b.y-p.y)/Math.max(dd,1)*.025*dt}let s=Math.hypot(b.dx,b.dy);if(s>2){b.dx=b.dx/s*2;b.dy=b.dy/s*2}}}
function tag(){let best=null,d=52;for(let b of bots)if(b.on){let q=Math.hypot(p.x-b.x,p.y-b.y);if(q<d){best=b;d=q}}if(best){best.on=0;score++;document.getElementById('score').textContent=score;if(score===5)setTimeout(next,500)}}function next(){round++;score=0;document.getElementById('round').textContent=round;document.getElementById('score').textContent=0;if(round%5===1&&unlocked<skins.length){unlocked++;localStorage.mmUnlock=unlocked;buildSkins();alert('New mushroom skin unlocked! 🍄')}area=(area+1)%names.length;document.getElementById('area').textContent=names[area];mkBots()}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;bg();upd(dt);for(let b of bots)if(b.on)mush(b,b.col);mush(p,skins[sel]);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==='e'||e.key==='E')tag();if(e.code==='Space')dash=18});addEventListener('keyup',e=>keys[e.key]=0);function hold(q,k){let b=document.querySelector(q);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=e=>{e.preventDefault();keys[k]=0}}hold('.u','ArrowUp');hold('.d','ArrowDown');hold('.l','ArrowLeft');hold('.r','ArrowRight');document.querySelector('.tag').onclick=tag;document.querySelector('.dash').onclick=()=>dash=18;
function buildSkins(){let s=document.getElementById('skins');s.innerHTML='';for(let i=0;i<unlocked;i++){let b=document.createElement('button');b.className='skin'+(i===sel?' sel':'');b.style.background=skins[i];b.onclick=()=>{sel=i;buildSkins()};s.appendChild(b)}}buildSkins();document.getElementById('play').onclick=()=>document.getElementById('start').classList.add('hidden');document.getElementById('mapBtn').onclick=()=>document.getElementById('map').classList.remove('hidden');document.getElementById('closeMap').onclick=()=>document.getElementById('map').classList.add('hidden');let pl=document.getElementById('places');names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{area=i;document.getElementById('area').textContent=n;mkBots();document.getElementById('map').classList.add('hidden')};pl.appendChild(b)});
</script></body></html>
